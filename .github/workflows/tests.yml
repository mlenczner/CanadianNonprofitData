name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (pyflakes checks only -- see .flake8)
        run: python -m flake8 analysis discovery tests

      - name: Run tests
        run: python -m pytest tests/ -v
